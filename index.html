<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsightFlow — Intelligent Feedback & Decision Platform</title>
  
  <!-- External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen">

  <!-- Navigation Header -->
  <header class="border-b sticky top-0 z-50 backdrop-blur">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-xl text-white">⚡</div>
        <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-500 to-cyan-500 bg-clip-text text-transparent">InsightFlow</h1>
      </div>
      <div class="flex items-center gap-3">
        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="p-2 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800 transition" title="Toggle Light/Dark Mode">
          <span id="themeIcon">🌙</span>
        </button>

        <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 font-medium">Adaption AI Active</span>
        <button id="exportPdfBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm">Export PDF Report</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">

    <!-- KPI Summary Cards -->
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-transparent border-none shadow-none">
      <div class="theme-card border p-5 rounded-xl">
        <p class="text-xs font-semibold uppercase tracking-wider text-muted">Total Feedback</p>
        <p id="kpiTotal" class="text-3xl font-bold mt-2 text-heading">0</p>
      </div>
      <div class="theme-card border p-5 rounded-xl">
        <p class="text-xs font-semibold uppercase tracking-wider text-muted">Net Sentiment</p>
        <p id="kpiSentiment" class="text-3xl font-bold mt-2 text-cyan-500">0%</p>
      </div>
      <div class="theme-card border p-5 rounded-xl">
        <p class="text-xs font-semibold uppercase tracking-wider text-muted">Critical Issues</p>
        <p id="kpiCritical" class="text-3xl font-bold mt-2 text-rose-500">0</p>
      </div>
      <div class="theme-card border p-5 rounded-xl">
        <p class="text-xs font-semibold uppercase tracking-wider text-muted">Primary Driver</p>
        <p id="kpiDriver" class="text-xl font-bold mt-2 text-amber-500">UI/UX Bug</p>
      </div>
    </section>

    <!-- Controls & Upload Section -->
    <section class="theme-card border p-6 rounded-xl flex flex-wrap gap-4 justify-between items-center">
      <div class="flex items-center gap-3">
        <!-- Load Demo Dataset -->
        <button id="loadDemoBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow-sm">
          Load Demo Dataset
        </button>
        
        <!-- Upload CSV File -->
        <label class="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 text-sm font-medium px-4 py-2 rounded-lg cursor-pointer transition shadow-sm">
          Upload CSV File
          <input type="file" id="csvFileInput" accept=".csv" class="hidden">
        </label>

        <!-- Download Template CSV -->
        <button id="downloadTemplateBtn" class="border border-indigo-300 dark:border-indigo-800 bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm">
          Download Template CSV
        </button>

        <!-- Clear All Data -->
        <button id="clearAllBtn" class="border border-rose-300 dark:border-rose-900 bg-white dark:bg-slate-800 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm">
          Clear All Data
        </button>
      </div>

      <!-- Search & Category Filters -->
      <div class="flex gap-3">
        <input type="text" id="searchInput" placeholder="Search feedback..." class="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <select id="categoryFilter" class="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="ALL">All Categories</option>
          <option value="UI/UX Bug">UI/UX Bug</option>
          <option value="Billing">Billing</option>
          <option value="Performance">Performance</option>
          <option value="Feature Request">Feature Request</option>
        </select>
      </div>
    </section>

    <!-- Analytics Dashboard Visualizations -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-transparent border-none shadow-none">
      <div class="theme-card border p-6 rounded-xl">
        <h3 class="text-base font-semibold mb-4 text-heading">Sentiment Distribution</h3>
        <div class="chart-container">
          <canvas id="sentimentChart"></canvas>
        </div>
      </div>
      <div class="theme-card border p-6 rounded-xl">
        <h3 class="text-base font-semibold mb-4 text-heading">Recurring Complaints by Topic</h3>
        <div class="chart-container">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
    </section>

    <!-- Feedback Table -->
    <section class="theme-card border p-6 rounded-xl">
      <h3 class="text-base font-semibold mb-4 text-heading">Customer Feedback Logs</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="text-xs uppercase tracking-wider border-b">
            <tr>
              <th class="px-4 py-3">Source</th>
              <th class="px-4 py-3">Customer</th>
              <th class="px-4 py-3">Feedback Text</th>
              <th class="px-4 py-3">Category</th>
              <th class="px-4 py-3">Sentiment</th>
              <th class="px-4 py-3">Date</th>
            </tr>
          </thead>
          <tbody id="feedbackTableBody" class="divide-y border-slate-200 dark:divide-slate-800">
            <!-- Dynamic rows injected via js/app.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="js/mockData.js"></script>
  <script src="js/csvParser.js"></script>
  <script src="js/aiEngine.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
