<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsightFlow — Intelligent Feedback & Decision Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse CDN for CSV Ingestion -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <!-- jsPDF CDN for Report Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Navigation Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-xl">⚡</div>
        <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">InsightFlow</h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Adaption AI Active</span>
        <button id="exportPdfBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition">Export PDF Report</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">

    <!-- KPI Summary Section -->
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-800/50 border border-slate-700/50 p-5 rounded-xl">
        <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Total Feedback</p>
        <p id="kpiTotal" class="text-3xl font-bold mt-2">0</p>
      </div>
      <div class="bg-slate-800/50 border border-slate-700/50 p-5 rounded-xl">
        <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Net Sentiment</p>
        <p id="kpiSentiment" class="text-3xl font-bold mt-2 text-cyan-400">0%</p>
      </div>
      <div class="bg-slate-800/50 border border-slate-700/50 p-5 rounded-xl">
        <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Critical Issues</p>
        <p id="kpiCritical" class="text-3xl font-bold mt-2 text-rose-400">0</p>
      </div>
      <div class="bg-slate-800/50 border border-slate-700/50 p-5 rounded-xl">
        <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Primary Driver</p>
        <p id="kpiDriver" class="text-xl font-bold mt-2 text-amber-400">UI/UX Bug</p>
      </div>
    </section>

    <!-- Data Controls & Upload Section -->
    <section class="bg-slate-800/40 border border-slate-700/50 p-6 rounded-xl flex flex-wrap gap-4 justify-between items-center">
      <div class="flex items-center gap-4">
        <button id="loadDemoBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium px-4 py-2 rounded-lg transition">Load Demo Dataset</button>
        <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 text-sm px-4 py-2 rounded-lg cursor-pointer transition">
          Upload CSV File
          <input type="file" id="csvFileInput" accept=".csv" class="hidden">
        </label>
      </div>
      <div class="flex gap-3">
        <input type="text" id="searchInput" placeholder="Search feedback..." class="bg-slate-900 border border-slate-700 text-sm text-slate-200 px-4 py-2 rounded-lg focus:outline-none focus:border-indigo-500">
        <select id="categoryFilter" class="bg-slate-900 border border-slate-700 text-sm text-slate-200 px-3 py-2 rounded-lg focus:outline-none focus:border-indigo-500">
          <option value="ALL">All Categories</option>
          <option value="UI/UX Bug">UI/UX Bug</option>
          <option value="Billing">Billing</option>
          <option value="Performance">Performance</option>
          <option value="Feature Request">Feature Request</option>
        </select>
      </div>
    </section>

    <!-- Analytics Dashboard Visualizations -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-slate-800/40 border border-slate-700/50 p-6 rounded-xl">
        <h3 class="text-base font-semibold mb-4">Sentiment Distribution</h3>
        <canvas id="sentimentChart" class="max-h-64"></canvas>
      </div>
      <div class="bg-slate-800/40 border border-slate-700/50 p-6 rounded-xl">
        <h3 class="text-base font-semibold mb-4">Recurring Complaints by Topic</h3>
        <canvas id="categoryChart" class="max-h-64"></canvas>
      </div>
    </section>

  </main>

  <script src="js/mockData.js"></script>
  <script src="js/csvParser.js"></script>
  <script src="js/aiEngine.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
